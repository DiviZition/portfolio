<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viktor P. | Portfolio</title>
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  <div id="app">
    <header id="profile-section" class="section profile-section"></header>
    <main id="projects-section" class="section projects-section">
      <h2 class="section-title">Projects</h2>
      <div id="roadmap-container" class="roadmap-container"></div>
    </main>
  </div>

  <div id="project-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="skills-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content skills-modal-content">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h2 class="skills-modal-title">Skills</h2>
      <div id="skills-body" class="skills-body"></div>
    </div>
  </div>

  <div id="media-lightbox" class="lightbox hidden">
    <div class="lightbox-overlay"></div>
    <button class="lightbox-nav-btn lightbox-prev" aria-label="Previous">&#10094;</button>
    <button class="lightbox-nav-btn lightbox-next" aria-label="Next">&#10095;</button>
    <div id="lightbox-content" class="lightbox-content"></div>
    <div id="lightbox-thumbnails" class="lightbox-thumbnails"></div>
  </div>

  <div id="global-tooltip" class="store-tooltip-global"></div>

  <button id="back-to-top" class="back-to-top" aria-label="Back to top">◭</button>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
